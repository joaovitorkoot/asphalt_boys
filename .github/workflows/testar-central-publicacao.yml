name: Testar central de pendencias de publicacao
on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - '.github/workflows/testar-central-publicacao.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Testar lista de pendencias, publicacao, confirmacao, login e dependencias
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('admin.html','utf8');
          new vm.Script(html.slice(html.lastIndexOf('<script>')+8,html.lastIndexOf('</script>')));
          assert(html.includes('id="publicationQueue"'),'Footer publication section missing');
          assert(html.includes('href="#publicationQueue"'),'Quick link missing');
          assert(html.includes('renderPublicationQueue();'),'Must refresh queue when form renders');
          const start=html.indexOf('function publicationQueueItems(){');
          const end=html.indexOf('function render(resetPicker=true){',start);
          assert(start>0&&end>start,'Queue functions missing');
          const source=html.slice(start,end);
          const data={
            destinos:[
              {id:'guaramiranga',nome:'Guaramiranga',status:'publicado'},
              {id:'serra-alta',nome:'Serra Alta',status:'rascunho'}
            ],
            paradas:[
              {id:'canaa',nome:'Canaã Pães',destinoId:'guaramiranga',categoria:'cafe',categorias:['cafe','almoco'],
                endereco:'Centro',foto:'https://asphalt-boys.pages.dev/api/image?id=foto1',status:'rascunho'},
              {id:'pico',nome:'Pico Alto',destinoId:'guaramiranga',categoria:'turismo',endereco:'Pico Alto',status:'publicado'}
            ],
            rotas:[{id:'rota-serra',nome:'Circuito Serra',destinoId:'guaramiranga',paradas:['canaa','pico'],
              status:'rascunho'}]
          };
          const draft={
            destinos:[
              {id:'guaramiranga',nome:'Guaramiranga',status:'publicado'},
              {id:'canoa-quebrada',nome:'Canoa Quebrada',status:'publicado'}
            ],
            paradas:[
              {...data.paradas[0]},
              {id:'parada-local',nome:'Parada só no aparelho',destinoId:'serra-alta',
               categoria:'almoco',endereco:'Centro',status:'rascunho'}
            ],
            rotas:[]
          };
          const published={destinos:[data.destinos[0]],paradas:[data.paradas[1]],rotas:[]};
          const ui={
            '#publicationQueueList':{innerHTML:'',querySelectorAll:()=>[]},
            '#publicationQueueCounts':{textContent:''},
            '#pendingTopCount':{textContent:''},
            '#publicationQueueMessage':{textContent:''},
            '#publicationQueue':{scrollIntoView(){}},
            '#recordForm':{scrollIntoView(){}}
          };
          const errors=[],messages=[],requests=[];
          let approved=true, renders=0, draftCleared=0;
          const ctx={
            types:['destinos','paradas','rotas'],data,draft,remote:true,token:'',sessionReady:true,
            tab:'paradas',editing:'canaa',photoUploading:false,busy:false,
            selectedDestId:'guaramiranga',creatingNewDestination:false,selectedStopCategory:'cafe',picked:[],
            destinationsForPicker:()=>[{id:'guaramiranga',nome:'Guaramiranga'},{id:'serra-alta',nome:'Serra Alta'}],
            categoryLabelsForStop:p=>(p.categorias||[p.categoria]).join(' / '),
            categoriesForStop:p=>p.categorias||[p.categoria],
            safeUrl:v=>String(v||'').startsWith('https://')?v:'',
            esc:v=>String(v),$:q=>ui[q]||null,
            alert:x=>errors.push(x),confirm:()=>approved,
            announce:x=>messages.push(x),saveLocal:()=>{},storeUnfinishedForm:()=>true,
            clearUnfinishedForm:()=>{draftCleared++},
          };
          const handlers=vm.runInNewContext(source+
            '\n({publicationQueueItems,renderPublicationQueue,publishQueuedRecord,openQueuedRecord})',ctx);
          ctx.render=()=>{renders++;handlers.renderPublicationQueue()};
          ctx.call=async (method,body,admin=true)=>{
            requests.push({method,body,admin});
            if(method==='POST'){
              const record={...body.record,status:'publicado'};
              published[body.kind]=published[body.kind].filter(p=>p.id!==record.id).concat(record);
              return {record};
            }
            if(method==='GET'&&!admin)return published;
            throw Error('Unexpected operation '+method);
          };
          const pending=handlers.publicationQueueItems();
          assert.equal(pending.length,4,'Only unsaved local and unpublished server items should appear');
          assert.equal(pending.filter(x=>x.record.id==='canaa').length,1,'Same stop must not duplicate');
          assert(!pending.some(x=>x.record.id==='canoa-quebrada'),'Published seed card is not pending');
          assert(!pending.some(x=>x.record.id==='pico'),'Already published stop is not pending');
          handlers.renderPublicationQueue();
          assert.equal(ui['#pendingTopCount'].textContent,'4');
          assert(ui['#publicationQueueCounts'].textContent.includes('2 publicado'));
          assert(ui['#publicationQueueList'].innerHTML.includes('Canaã Pães'));
          assert(ui['#publicationQueueList'].innerHTML.includes('Apenas neste aparelho'));
          const button=()=>({disabled:false,textContent:'Publicar no site',isConnected:true});
          const b=button();
          await handlers.publishQueuedRecord('rotas','rota-serra',b);
          assert(errors.some(x=>x.includes('Publique primeiro')),'Route must wait for its stops');
          assert.equal(requests.length,0);
          approved=false;
          await handlers.publishQueuedRecord('paradas','canaa',b);
          assert.equal(requests.length,0,'Cancelling must not publish');
          approved=true;
          await handlers.publishQueuedRecord('paradas','canaa',b);
          assert.equal(requests.length,2,'Publish once and verify public data');
          assert.equal(requests[0].body.kind,'paradas');
          assert.deepEqual(Array.from(requests[0].body.record.categorias),['cafe','almoco']);
          assert.equal(requests[0].body.record.foto,data.paradas.find(x=>x.id==='canaa').foto);
          assert.equal(data.paradas.find(x=>x.id==='canaa').status,'publicado');
          assert.equal(handlers.publicationQueueItems().length,3);
          assert.equal(draftCleared,1,'No stale form draft after publishing current record');
          await handlers.publishQueuedRecord('rotas','rota-serra',button());
          assert.equal(data.rotas[0].status,'publicado');
          assert.equal(handlers.publicationQueueItems().length,2);
          await handlers.publishQueuedRecord('paradas','parada-local',button());
          assert(errors.some(x=>x.includes('Publique primeiro o destino')),'Unpublished custom destination must block publication');
          await handlers.publishQueuedRecord('destinos','serra-alta',button());
          assert.equal(data.destinos.find(x=>x.id==='serra-alta').status,'publicado');
          await handlers.publishQueuedRecord('paradas','parada-local',button());
          assert(data.paradas.some(x=>x.id==='parada-local'&&x.status==='publicado'));
          assert.equal(handlers.publicationQueueItems().length,0);
          assert(ui['#publicationQueueList'].innerHTML.includes('Nenhum cadastro'));
          assert(renders>=4);
          assert(messages.some(x=>x.includes('Publicado')));
          console.log('PASS: pending queue across tabs, no duplicates, no seed ghosts, confirm, D1 public verification, dependency safety');
          NODE
