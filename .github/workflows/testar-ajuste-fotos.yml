name: Testar ajuste automatico das fotos
on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - '.github/workflows/testar-ajuste-fotos.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar blur real, Safari, JPEG, enquadramento e compressao
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('admin.html','utf8');
          new vm.Script(html.slice(html.lastIndexOf('<script>')+8,html.lastIndexOf('</script>')));
          const first=html.indexOf('function drawSoftPhotoBackground(');
          const last=html.indexOf('function setPhotoCredits(meta)',first);
          assert(first>0&&last>first,'Image blur + resizing not found');
          const code=html.slice(first,last);
          function mock(mode,pixelRead=true){
            const shapes=[],encoded=[],calls={putImage:0,pixelRead:0,overlay:0};
            class MockImage{
              naturalWidth=2400;naturalHeight=1600;
              set src(url){if(this.onload)this.onload()}
            }
            const url={createObjectURL:()=> 'blob:photo',revokeObjectURL:()=>{}};
            const document={createElement(kind){
              assert.equal(kind,'canvas');
              const canvas={width:0,height:0};
              const ctx={fillStyle:'',save(){},restore(){},
                fillRect(){if(this.fillStyle.startsWith('rgba('))calls.overlay++},
                drawImage(img,x,y,w,h){
                  shapes.push({cw:canvas.width,ch:canvas.height,x,y,w,h,original:img instanceof MockImage});
                },
                getImageData(){
                  calls.pixelRead++;
                  if(!pixelRead)throw Error('No pixel access');
                  return {data:new Uint8ClampedArray(canvas.width*canvas.height*4).fill(100)};
                },
                putImageData(){calls.putImage++}
              };
              canvas.getContext=()=>ctx;
              canvas.toBlob=(callback,type,quality)=>{
                encoded.push({type,quality,width:canvas.width,height:canvas.height});
                if(mode==='safari'&&type==='image/webp')
                  return callback({type:'image/png',size:450000});
                if(mode==='safari'&&type==='image/jpeg')
                  return callback({type:'image/jpeg',size:125000});
                if(mode==='large'){
                  const bytes=Math.round((canvas.width*canvas.height)/2);
                  return callback({type,size:bytes});
                }
                return callback({type,size:115000});
              };
              return canvas;
            }};
            return {url,document,MockImage,shapes,encoded,calls};
          }
          async function check(mode,kind,expectedMime,pixelRead=true){
            const m=mock(mode,pixelRead);
            const context={URL:m.url,document:m.document,Image:m.MockImage,tab:kind,Error,Math,Promise,Uint8ClampedArray};
            const prepare=vm.runInNewContext(code+'\npreparePhoto',context);
            const result=await prepare({type:'image/jpeg',size:15000000},kind);
            assert.equal(result.type,expectedMime);
            assert(result.size<=200000);
            assert(m.calls.overlay>0,'Must darken the blurred backdrop');
            assert(m.calls.pixelRead>0,'Must attempt real pixel blur for Safari');
            assert(pixelRead?m.calls.putImage>0:m.calls.putImage===0,'Must use pixel blur when available');
            assert(m.shapes.some(x=>!x.original&&x.cw>=240),'Must upscale blurred miniature, never unblurred source');
            const foreground=m.shapes.filter(x=>x.original&&x.cw>=240);
            assert(foreground.length>0,'Foreground photo missing');
            for(const image of foreground){
              assert(image.w<=image.cw&&image.h<=image.ch,'Main photo cropped');
              assert(image.x>=0&&image.y>=0,'Main photo cropped');
            }
            if(kind==='paradas')assert(m.encoded.every(x=>x.width===x.height));
            else assert(m.encoded.every(x=>Math.abs(x.width/x.height-16/9)<.02));
            return m.encoded;
          }
          const safari=await check('safari','paradas','image/jpeg');
          assert(safari.some(x=>x.type==='image/webp'));
          assert(safari.some(x=>x.type==='image/jpeg'));
          const large=await check('large','paradas','image/webp');
          assert(large.some(x=>x.width<900),'Must reduce dimensions for large outputs');
          await check('safari','destinos','image/jpeg');
          await check('safari','paradas','image/jpeg',false);
          console.log('PASS: blurred/dark background on iOS, fallback, no crop, 1:1 + 16:9, JPEG, compression');
          NODE
