name: Garantir links e coordenadas exatas do Maps
on:
  push:
    branches: [main]
    paths:
      - 'planejador.js'
      - 'admin.html'
      - 'functions/api/map-coordinates.js'
      - 'functions/api/maps-import.js'
      - '.github/workflows/testar-localizacao-exata.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar links originais, coordenadas e rotas sem aproximacoes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const planner=fs.readFileSync('planejador.js','utf8');
          const admin=fs.readFileSync('admin.html','utf8');
          new vm.Script(planner);
          new vm.Script(admin.slice(admin.lastIndexOf('<script>')+8,admin.lastIndexOf('</script>')));
          assert(admin.includes('id="testExactMapsLink"'));
          assert(admin.includes("window.open(exact,'_blank','noopener,noreferrer')"));
          assert(admin.includes("if(result.verified&&result.mapCoordinates)v.mapCoordinates=result.mapCoordinates;"));
          assert(planner.includes('if(!httpsUrl(p.maps)&&httpsUrl(result.map))'));
          const helpers=planner.slice(planner.indexOf(' const httpsUrl=s=>'),planner.indexOf(' const mapLink=p=>'));
          const mapCode=planner.slice(planner.indexOf(' const mapLink=p=>'),planner.indexOf(' const mapping=id=>'));
          const mapping=vm.runInNewContext(helpers+'\n'+mapCode+'\nmapLink',{URL});
          const original='https://maps.app.goo.gl/CCQuEH8HfXjQT5gG8';
          assert.equal(mapping({maps:original,googlePlaceId:'ChIJwrong'}),original,'Must open original shared Google Maps URL');
          const routeCode=planner.slice(planner.indexOf(' function routePoint(stop){'),planner.indexOf(' function share(){'));
          const funcs=vm.runInNewContext(helpers+'\n'+routeCode+'\n({routePoint,routeSegmentsFor})',{
            URL,destination:{dest:'Guaramiranga, Ceará',nome:'Guaramiranga'},destinationUrl:()=> 'Guaramiranga, Ceará'
          });
          const gps={id:'p',nome:'Pico Alto',mapCoordinates:'-4.2080812,-38.9747743',
            googlePlaceId:'ChIJwrong',endereco:'Pico Alto'};
          assert.equal(funcs.routePoint(gps).type,'gps','Original coordinates override a potentially wrong Place ID');
          let result=funcs.routeSegmentsFor([gps],'Horizonte, CE');
          assert.equal(result.segments.length,1);
          let url=new URL(result.segments[0].url);
          assert.equal(url.searchParams.get('waypoints'),'-4.2080812,-38.9747743');
          assert.equal(url.searchParams.get('waypoint_place_ids'),null);
          const place={id:'c',nome:'Restaurante cadastrado',mapCoordinates:'',
            googlePlaceId:'ChIJcorrect123',endereco:'Guaramiranga, Ceará'};
          result=funcs.routeSegmentsFor([place],'Horizonte, CE');
          assert.equal(result.segments.length,1);
          url=new URL(result.segments[0].url);
          assert.equal(url.searchParams.get('waypoint_place_ids'),'ChIJcorrect123');
          // Antes, combinar GPS e Place ID bloqueava toda a navegação.
          result=funcs.routeSegmentsFor([gps,place],'Horizonte, CE');
          assert.equal(result.unresolved.length,0);
          assert.equal(result.segments.length,2,'Mixed GPS and Places must create precise connected legs');
          const first=new URL(result.segments[0].url),second=new URL(result.segments[1].url);
          assert.equal(first.searchParams.get('destination_place_id'),'ChIJcorrect123');
          assert.equal(second.searchParams.get('origin_place_id'),'ChIJcorrect123');
          assert.equal(second.searchParams.get('destination'),'Guaramiranga, Ceará');
          assert.equal(first.searchParams.get('destination'),second.searchParams.get('origin'));
          const module=async path=>import('data:text/javascript;base64,'+Buffer.from(fs.readFileSync(path,'utf8')).toString('base64'));
          const resolver=(await module('functions/api/map-coordinates.js')).onRequestPost;
          const importer=(await module('functions/api/maps-import.js')).onRequestPost;
          const token='local-test-secret-longer-than-twenty-chars';
          const env={ADMIN_TOKEN:token,GOOGLE_PLACES_API_KEY:'mock-google-key'};
          const req=(path,url)=>new Request('https://asphalt-boys.pages.dev/api/'+path,{
            method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({url})
          });
          const gpsUrl='https://www.google.com/maps/search/?api=1&query=-4.2080812%2C-38.9747743';
          let r=await resolver({request:req('map-coordinates',gpsUrl),env});
          assert.equal(r.status,200);
          assert.equal((await r.json()).mapCoordinates,'-4.2080812,-38.9747743');
          r=await importer({request:req('maps-import',gpsUrl),env});
          assert.equal(r.status,200);
          const imported=await r.json();
          assert.equal(imported.results[0].maps,gpsUrl);
          assert.equal(imported.results[0].mapCoordinates,'-4.2080812,-38.9747743');
          assert.equal(imported.results[0].id,'');
          const expanded='https://www.google.com/maps/place/Pico+Alto/@-4.2081293,-38.9751541,2111m/data=!3m1!1e3!4m6!3m5!1s0x7bf3fefad1db533:0x7b92506ff55b03d0!8m2!3d-4.2080812!4d-38.9747743';
          globalThis.fetch=async (url)=>{
            if(url===original)return new Response(null,{status:302,headers:{location:expanded}});
            if(String(url).includes('places:searchText'))return Response.json({places:[{id:'ChIJcorrect123',displayName:{text:'Pico Alto'},formattedAddress:'Pernambuquinho, Guaramiranga',location:{latitude:-4.2080812,longitude:-38.9747743}}]});
            throw Error('Unexpected outbound fetch '+url);
          };
          r=await resolver({request:req('map-coordinates',original),env});
          assert.equal((await r.json()).mapCoordinates,'-4.2080812,-38.9747743');
          r=await importer({request:req('maps-import',original),env});
          assert.equal(r.status,200);
          const fromShort=await r.json();
          assert.equal(fromShort.results[0].maps,original,'Importer must preserve original short URL');
          assert.equal(fromShort.results[0].mapCoordinates,'-4.2080812,-38.9747743');
          console.log('PASS: exact shared Maps URL, GPS link, short-link pin, imported URL and waypoint correctness');
          NODE
