name: Testar categorias e edicao admin
on:
  push:
    branches: [feature/admin-categorias-editar-paradas]
  pull_request:
    paths:
      - 'admin.html'
      - 'index.html'
      - 'planejador.js'
      - '.github/workflows/testar-categorias-admin.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify category parity and editable existing content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('admin.html','utf8');
          const publicJs=fs.readFileSync('planejador.js','utf8');
          const admin=(html.match(/<script>([\s\S]*?)<\/script>/)?.[1] || (()=>{throw Error('Inline JavaScript not found')})());
          new vm.Script(admin);new vm.Script(publicJs);
          const helper=admin.slice(admin.indexOf('const KEY='),admin.indexOf('function normalizedPlaceName'));
          const run=(code)=>vm.runInNewContext(helper+'\n'+code,{localStorage:{getItem(){return null},setItem(){}}});
          for(const value of ['cafe','almoco','turismo','descanso']){
            assert(publicJs.includes("['"+value+"'"),'Public missing '+value);
            assert(html.includes("['"+value+"'"),'Admin missing '+value);
          }
          assert(html.includes('data-stop-category'));
          assert(html.includes('data-stop-quick'));
          assert(html.includes('data-edit'));
          assert(html.includes('data-select-dest'));
          assert(html.includes("v.destinoId=selectedDestId"));
          assert(html.includes('function editableRoutes('));
          assert(html.includes('function editableStops('));
          assert(publicJs.includes('stopCategories('),'Public planner category handling missing');
          // No default stops are seeded: D1 is the source of truth.
          let obj=JSON.parse(run("JSON.stringify({guara:editableStops('guaramiranga'),canoa:editableStops('canoa-quebrada')})"));
          assert.equal(obj.guara.length,0,'Deleted/default stops must not reappear');
          assert.equal(obj.canoa.length,0,'Destinations must not share stops');
          // Database record overrides a matching local draft while preserving category and image.
          let result=run("remote=true;draft.paradas=[{id:'pico-alto-parada',destinoId:'guaramiranga',nome:'Rascunho',categoria:'turismo'}];data={destinos:[],paradas:[{id:'pico-alto-parada',destinoId:'guaramiranga',nome:'Pico Alto modificado',categoria:'cafe',categorias:['cafe','almoco'],status:'publicado',foto:'https://example.org/new.jpg'}],rotas:[]};JSON.stringify({stops:editableStops('guaramiranga'),other:editableStops('canoa-quebrada'),routes:editableRoutes('guaramiranga')})");
          obj=JSON.parse(result);
          assert.equal(obj.stops.length,1,'Database and drafts cannot duplicate a stop');
          assert.equal(obj.stops[0].nome,'Pico Alto modificado');
          assert.equal(obj.stops[0].foto,'https://example.org/new.jpg');
          assert.deepEqual(obj.stops[0].categorias,['cafe','almoco']);
          assert.equal(obj.stops[0]._origin,'database');
          assert.equal(obj.other.length,0);
          // Offline draft remains available, without publishing it or inventing default stops.
          result=run("remote=true;draft.paradas=[{id:'rascunho',destinoId:'guaramiranga',nome:'Parada local',categoria:'turismo',status:'rascunho'}];draft.rotas=[{id:'rota-antiga',destinoId:'guaramiranga',nome:'Rota antiga',paradas:['rascunho']}];data={destinos:[],paradas:[],rotas:[]};JSON.stringify({stops:editableStops('guaramiranga'),routes:editableRoutes('guaramiranga')})");
          obj=JSON.parse(result);
          assert.equal(obj.stops.length,1);
          assert.equal(obj.stops[0]._origin,'local');
          assert.equal(obj.routes.length,1);
          assert.deepEqual(obj.routes[0].paradas,['rascunho']);
          assert.equal(obj.routes[0]._origin,'local');
          // The category selector must allow one record in several categories.
          result=run("JSON.stringify({markup:stopCategoriesMarkup({categoria:'cafe',categorias:['cafe','almoco']}),labels:categoryLabelsForStop({categoria:'cafe',categorias:['cafe','almoco']})})");
          obj=JSON.parse(result);
          assert(obj.markup.includes('name=\\"categorias\\" value=\\"cafe\\" checked'));
          assert(obj.markup.includes('name=\\"categorias\\" value=\\"almoco\\" checked'));
          assert(obj.labels.includes('Almoço'));
          console.log('PASS: no ghost stops, D1 precedence, local drafts, categories, image preservation');
          NODE
