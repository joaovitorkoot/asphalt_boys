name: Diagnosticar fotos direto na Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/photo-diagnostics.js'
      - '.github/workflows/diagnosticar-fotos-cloudflare.yml'
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Ler somente os status das fontes na producao
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          url='https://asphalt-boys.pages.dev/api/photo-diagnostics'
          headers={'User-Agent':'AsphaltBoys-Healthcheck/1.0','Cache-Control':'no-cache','Accept':'application/json'}
          for i in range(10):
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as resp:
                result=json.load(resp)
                print('PRODUCTION',json.dumps(result,ensure_ascii=False))
                break
            except urllib.error.HTTPError as e:
              print('Waiting production deployment:',e.code)
              if i>=9:raise
              time.sleep(4)
          PY
      - name: Resolver link curto do usuario sem API de fotos
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          short='https://maps.app.goo.gl/BoDtL3Bt7H8deCMs9'
          for ua in ['AsphaltBoysPlacesImport/1.0','Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36']:
            try:
              req=urllib.request.Request(short,headers={'User-Agent':ua})
              with urllib.request.urlopen(req,timeout=18) as res:
                print('GOOGLE_LINK','status',res.status,'final',res.url[:700])
            except Exception as exc:print('GOOGLE_LINK_ERROR',type(exc).__name__,str(exc)[:100])
          PY
