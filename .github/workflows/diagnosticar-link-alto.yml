name: Diagnosticar links dos pontos Alto
on:
  push:
    branches: [fix/guaramiranga-place-links-and-credits]
    paths: [.github/workflows/diagnosticar-link-alto.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Identificar local original e cadastro publico sem alterar dados
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json
          UA={'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36','Cache-Control':'no-cache'}
          for url in ['https://maps.app.goo.gl/CCQuEH8HfXjQT5gG8','https://maps.app.goo.gl/BoDtL3Bt7H8deCMs9']:
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=20) as r:
                parsed=urllib.parse.urlsplit(r.url)
                print('MAPS_REDIRECT',url,'status',r.status,'result',urllib.parse.unquote(parsed.path)[:250],'coords',[(v,parsed.path.find(v)) for v in ['/@','/place/']])
            except Exception as e: print('MAPS_ERROR',type(e).__name__,str(e)[:160])
          with urllib.request.urlopen(urllib.request.Request('https://asphalt-boys.pages.dev/api/content',headers=UA),timeout=20) as r:
            print('PUBLIC_HTTP',r.status)
            d=json.load(r)
          for kind in ['destinos','paradas','rotas']:
            for p in d.get(kind,[]):
              print('PUBLIC_RECORD',kind,json.dumps({k:p.get(k) for k in ['id','nome','destinoId','status','categoria','maps','googlePlaceId','mapa','endereco','foto','fotoLicenca']},ensure_ascii=False))
          PY
