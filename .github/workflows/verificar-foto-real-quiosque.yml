name: Verificar foto real Quiosque Pico Alto
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-foto-real-quiosque.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar diagnostico de producao
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          url="https://asphalt-boys.pages.dev/api/teste-quiosque"
          for i in range(10):
            try:
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"AsphaltBoysOneTimeDiagnostics/1.0"})
              with urllib.request.urlopen(req,timeout=25) as r:
                obj=json.loads(r.read(10000))
                print("HTTP",r.status,"RESULT",json.dumps(obj,ensure_ascii=False))
                if obj.get("status")=="running":
                  time.sleep(3)
                  continue
                if obj.get("status")!="tested":
                  raise SystemExit("Google photo diagnostic could not complete")
                break
            except urllib.error.HTTPError as ex:
              print("HTTP",ex.code,ex.read(800).decode("utf-8","replace"))
              if ex.code==404 and i<9:time.sleep(4)
              else:raise
          PY
