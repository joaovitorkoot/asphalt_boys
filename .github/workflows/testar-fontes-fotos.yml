name: Diagnosticar fontes abertas de fotos
on:
  push:
    branches: [feature/buscador-fotos-abertas]
    paths: [.github/workflows/testar-fontes-fotos.yml]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verificar Wikimedia Commons e Openverse sem chaves
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json
          headers={'User-Agent':'AsphaltBoysTripPlanner/1.0 (support: github.com/joaovitorkoot/asphalt_boys)','Accept':'application/json'}
          def get(url):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=18) as r:
                return r.status,json.load(r)
            except Exception as e: return type(e).__name__,{'error':str(e)}
          for term in ['Pico Alto Guaramiranga','Guaramiranga Ceará','Serra de Baturité']:
            args={'action':'query','generator':'search','gsrsearch':term,'gsrnamespace':6,'gsrlimit':6,'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':'900','format':'json','formatversion':2}
            status,data=get('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(args))
            print('WIKIMEDIA',term,'status',status,[(x.get('title'),x.get('imageinfo',[{}])[0].get('extmetadata',{}).get('LicenseShortName',{}).get('value')) for x in data.get('query',{}).get('pages',[])][:6],data.get('error',''))
          for term in ['Pico Alto Guaramiranga','Guaramiranga Ceará','Serra de Baturité']:
            status,data=get('https://api.openverse.org/v1/images/?'+urllib.parse.urlencode({'q':term,'page_size':8,'license':'by,cc0,pdm'}))
            print('OPENVERSE',term,'status',status,'count',data.get('result_count'),[(x.get('title','')[:60],x.get('license'),x.get('thumbnail','')[:65]) for x in data.get('results',[])[:6]],data.get('error',''))
          PY
