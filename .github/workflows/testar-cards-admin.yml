name: Testar cards admin
on:
  push:
    branches: [feature/admin-selecionar-card-viagem]
  pull_request:
    paths:
      - 'admin.html'
      - 'index.html'
      - 'planejador.js'
      - '.github/workflows/testar-cards-admin.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and card isolation checks
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('admin.html','utf8');
          const js=(html.match(/<script>([\s\S]*?)<\/script>/)?.[1] || (()=>{throw Error('Inline JavaScript not found')})());
          new vm.Script(js);
          new vm.Script(fs.readFileSync('planejador.js','utf8'));
          for (const m of ['function destinationPicker()', 'v.destinoId=selectedDestId;', "v.id=creatingNewDestination?slugForDestination(v.nome):selectedDestId;", 'async function onPhotoChosen('])assert(html.includes(m),'missing: '+m);
          for(const file of ['functions/api/image-upload.js','functions/api/image.js']){const {execFileSync}=await import('node:child_process');execFileSync(process.execPath,['--check',file]);}
          console.log('PASS: admin and server scripts, card association');
          NODE
