name: Diagnosticar paradas de cafe no site
on:
  push:
    branches: [fix/public-breakfast-stop-sync]
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Ler registros publicos existentes (somente leitura)
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url='https://asphalt-boys.pages.dev/api/content'
          req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as r:
            print('HTTP',r.status)
            d=json.load(r)
          for key in ['destinos','paradas','rotas']:
            print(key,'publicados',len(d.get(key,[])))
            for x in d.get(key,[]):
              print('REGISTRO',key, json.dumps({k:x.get(k) for k in ['id','nome','destinoId','categoria','status']},ensure_ascii=False))
          PY
