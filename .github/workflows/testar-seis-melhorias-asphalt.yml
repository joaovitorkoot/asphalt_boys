name: Validar seis melhorias Asphalt Boys
on:
  pull_request:
    paths:
      - 'index.html'
      - 'planejador.js'
      - 'motos.html'
      - 'motos-v2.js'
      - 'admin.html'
      - 'site-feedback*'
      - 'functions/api/site-feedback.js'
      - 'tests/asphalt-new-features.test.mjs'
      - '.github/workflows/testar-seis-melhorias-asphalt.yml'
  push:
    branches: [feature/asphalt-boys-6-melhorias-20261110, main]
    paths:
      - 'index.html'
      - 'planejador.js'
      - 'motos.html'
      - 'motos-v2.js'
      - 'admin.html'
      - 'site-feedback*'
      - 'functions/api/site-feedback.js'
      - 'tests/asphalt-new-features.test.mjs'
      - '.github/workflows/testar-seis-melhorias-asphalt.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checar sintaxe
        run: |
          node --check planejador.js
          node --check motos-v2.js
          node --check site-feedback-public.js
          node --check site-feedback-admin.js
          node --check functions/api/site-feedback.js
      - name: Testar calendário, GPS, compartilhamento e moderação
        run: node --test tests/asphalt-new-features.test.mjs
