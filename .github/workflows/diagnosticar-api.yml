name: Diagnosticar APIs publicas Asphalt Boys
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnosticar-api.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verificar integracao real do site publicado
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse
          base='https://asphalt-boys.pages.dev'
          def get(path):
            req=urllib.request.Request(base+path,headers={
              'Accept':'application/json',
              'Cache-Control':'no-cache',
              'User-Agent':'AsphaltBoys-ProductionDiagnostic/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=22) as r:
                return r.status,json.loads(r.read(300000))
            except urllib.error.HTTPError as e:
              try: payload=json.loads(e.read(20000))
              except: payload={}
              return e.code,payload

          status,health=get('/api/health')
          assert status==200,'Health indisponivel'
          readiness={k:bool(health.get(k)) for k in ('databaseReady','adminReady','googleReady')}
          print('Producao: health HTTP',status,'readiness',readiness)

          status,content=get('/api/content')
          assert status==200,'Conteudo publico indisponivel'
          kinds=('destinos','paradas','rotas')
          counts={k:len(content.get(k,[])) for k in kinds}
          print('Producao: D1 HTTP',status,'publicados',counts)
          for k in kinds:
            assert isinstance(content.get(k),list),k+' nao e lista'
            assert all(p.get('status')=='publicado' for p in content[k]),k+' contem rascunhos'

          stops=content.get('paradas',[])
          for stop in stops[:5]:
            sid=str(stop.get('id',''))
            print('Parada publicada:',{
              'id':sid,'nome':stop.get('nome',''),
              'destinoId':stop.get('destinoId',''),
              'categoria':stop.get('categoria',''),
              'linkMapsSalvo':bool(stop.get('maps')),
              'coordenadasSalvas':bool(stop.get('mapCoordinates')),
              'fotoPropriaSalva':bool(stop.get('foto')),
              'googlePlaceIdSalvo':bool(stop.get('googlePlaceId'))
            })
            if sid:
              status,result=get('/api/place?stop='+urllib.parse.quote(sid,safe=''))
              print('Google Places da parada',sid,'HTTP',status,
                    'available',result.get('available'),
                    'nomeRetornado',str(result.get('name',''))[:80],
                    'temFotoGoogle',bool(result.get('photo')),
                    'message',str(result.get('message',''))[:200])
              if status==200 and result.get('available') and stop.get('maps'):
                assert result.get('map')==stop['maps'],'Google substituiu o link original do Maps'

          print('PASS: diagnostico publico concluido sem editar registros e sem exibir credenciais')
          PY
