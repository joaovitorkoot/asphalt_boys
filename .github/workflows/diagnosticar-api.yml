name: Diagnosticar APIs publicas Asphalt Boys
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnosticar-api.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Aguardar publicação das variáveis da Cloudflare
        run: sleep 35
      - name: Verificar status sem exibir credenciais
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          urls = {
            'google_places_producao': 'https://asphalt-boys.pages.dev/api/place?stop=pico-alto-parada',
            'google_places_preview': 'https://515fba76.asphalt-boys.pages.dev/api/place?stop=pico-alto-parada',
            'cloudflare_d1': 'https://asphalt-boys.pages.dev/api/content'
          }
          for name,url in urls.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'AsphaltBoys-Healthcheck/1.0'}),timeout=20) as r:
                status=r.status
                raw=r.read(20000).decode('utf-8','replace')
            except urllib.error.HTTPError as e:
              status=e.code
              raw=e.read(20000).decode('utf-8','replace')
            except Exception as e:
              print(name, 'network_error', type(e).__name__)
              continue
            try:
              payload=json.loads(raw)
              # Never print returned secret or raw HTTP body.
              print(name,'HTTP',status,'available:',payload.get('available','n/a'),'code:',payload.get('code','n/a'),'message:',str(payload.get('message',payload.get('error','ok')))[:260])
              if name=='cloudflare_d1' and status==200:
                print(name,'counts',{k:len(payload.get(k,[])) for k in ('destinos','paradas','rotas')})
            except Exception:
              print(name,'HTTP',status,'non_json_response')
          PY
